<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>Interfy Partner Editor</title>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color-scheme:dark;background:#18191b;color:#ddd;font-size:13px}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}
button{border:1px solid #414449;border-radius:6px;background:#33363a;color:#eee;padding:7px 11px;cursor:pointer}
button:hover{background:#42454b}button:disabled{opacity:.45;cursor:default}button.primary{background:#355a7a;border-color:#50799e}
button.danger{color:#ffafa7}button.small{padding:3px 7px;font-size:12px}
input,textarea,select{width:100%;padding:7px 9px;min-width:0;border:1px solid #45484d;border-radius:5px;background:#232529;color:#eee}
input[type=checkbox]{width:auto}textarea{min-height:60px;resize:vertical}h1,h2,h3,p{margin:0}
header{display:flex;align-items:center;gap:13px;padding:12px 16px;border-bottom:1px solid #36383b;background:#212225}
header h1{font-size:17px;letter-spacing:-.3px}header .brand{display:grid;gap:3px;min-width:185px}header small{font-size:10px;color:#aaa}
header .actions{display:flex;gap:7px;margin-left:auto;align-items:center;flex-wrap:wrap}
.notice{padding:8px 14px;border-bottom:1px solid #35383a;color:#aaa;font-size:11px}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);height:calc(100vh - 113px);min-height:420px}
aside{border-right:1px solid #383a3d;display:flex;flex-direction:column;min-height:0}
nav{display:flex;border-bottom:1px solid #383a3d}nav button{flex:1;border:0;border-radius:0;background:transparent;padding:11px}
nav button.active{background:#313943;border-bottom:2px solid #82b0d7}
.sidebar-tools{display:grid;grid-template-columns:1fr auto;gap:7px;padding:10px}
.list{overflow:auto;flex:1} .list-item{display:block;border:0;border-bottom:1px solid #2b2d30;border-radius:0;background:transparent;text-align:left;width:100%;padding:10px 13px;overflow-wrap:anywhere}
.related-message{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:10px 12px;border:0;border-bottom:1px solid #3b3e43;border-radius:0;background:transparent;text-align:left;color:inherit;overflow-wrap:anywhere}
.related-message:hover,.related-message:focus-visible{background:#303b47;outline:1px solid #82b0d7;outline-offset:-1px}
.related-message .related-name{font-weight:600}
.related-message .related-meta{font-size:11px;color:#a0a3aa}
.list-item.active{background:#303b47} .list-item strong{display:block;font-size:12px;margin-bottom:4px} .list-item small{display:block;color:#9c9fa5;font-size:10px}
main{overflow:auto;padding:20px 22px 50px;min-width:0}.editor{max-width:1060px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.section-title h2{font-size:17px}.hint{color:#a0a3aa;font-size:11px;line-height:1.5}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label,.field-table label{display:grid;gap:5px;font-size:11px;color:#b8bbc0}
.wide{grid-column:1/-1}.panel{border:1px solid #3b3e43;border-radius:8px;background:#202226;padding:15px;margin-bottom:15px}
.panel h3{font-size:13px;margin-bottom:12px}.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
.panel-head h3{margin:0}.node-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:6px}
.node-checks label{display:flex;align-items:center;gap:7px;background:#292b2e;border:1px solid #3c3f43;padding:7px;border-radius:5px;font-size:11px;cursor:pointer;overflow-wrap:anywhere}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:880px}
.resizable-table{table-layout:fixed;width:max-content;min-width:0}
.resizable-table th{position:relative;white-space:nowrap;user-select:none}
.resizable-table .col-resizer{position:absolute;right:-5px;top:0;bottom:0;width:10px;z-index:2;cursor:col-resize;touch-action:none}
.resizable-table .col-resizer:hover,.resizable-table .col-resizer.dragging{background:rgba(130,176,215,.45)}
.resizable-table td{overflow:hidden}
.resizable-table td input,.resizable-table td select,.resizable-table td textarea{width:100%;min-width:0;max-width:100%}
.resizable-table .field-range-cell{min-width:0}
.resizable-table .field-range{width:100%;min-width:0;resize:vertical}
.resizable-table td .controls{white-space:nowrap}
body.resizing-columns{cursor:col-resize!important;user-select:none!important}
th{text-align:left;font-size:10px;color:#aaa;font-weight:600;background:#2a2c30}
td,th{padding:6px;border:1px solid #414348}td input,td select{padding:6px;min-width:88px}
td textarea{min-width:140px;min-height:36px;padding:5px}
td .controls{display:flex;gap:3px}td .controls button{padding:5px}
.footer{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:10px 15px;border-top:1px solid #36383b;background:#212225;font-size:11px;color:#a1a5aa}
.message{color:#c9d7e8}.warn{color:#e6b97b}.error{color:#ffa39f}
.empty{text-align:center;color:#9ca0a5;padding:50px 20px}.pill{display:inline-block;background:#384655;border:1px solid #506477;color:#cfe2f4;padding:2px 7px;border-radius:30px;font-size:10px;margin-left:6px}
.help{border-left:3px solid #70889d;margin-top:12px;padding:9px 12px;color:#b7bbc0;background:#292c31}
.diagram-scroll{overflow:auto;border:1px solid #393f47;border-radius:8px;background:#191d23}
.node-diagram{display:block;width:100%;min-width:860px;height:auto;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
.node-diagram .edge{fill:none;stroke-width:2.4;opacity:.92;pointer-events:none}
.node-diagram .edge.in{stroke:#67c9ba}.node-diagram .edge.out{stroke:#89b7ee}
.node-diagram .edge-hit{fill:none;stroke:transparent;stroke-width:22;cursor:pointer;pointer-events:stroke}
.node-diagram .edge-group:hover .edge{stroke-width:4;opacity:1}
.node-diagram .edge-group.selected .edge{stroke:#ffcf7d;stroke-width:4;opacity:1}
.node-diagram .edge-group:focus-visible .edge{stroke:#ffcf7d;stroke-width:4;opacity:1}
.node-diagram .edge-group{outline:none}
.node-diagram .node-box{fill:#29323a;stroke:#607381;stroke-width:1.1}
.node-diagram .hub{fill:#314d66;stroke:#94badd;stroke-width:1.8}
.node-diagram .node-select{cursor:pointer;outline:none}
.node-diagram .node-select:hover .node-box,.node-diagram .node-select:focus-visible .node-box,.node-diagram .node-select.selected .node-box{fill:#3b5266;stroke:#ffcf7d;stroke-width:2}
.node-diagram .node-select:hover .hub,.node-diagram .node-select:focus-visible .hub{stroke:#ffcf7d;stroke-width:2.5}
.field-range{width:290px;min-width:240px;min-height:112px;line-height:1.6;resize:both;white-space:pre-wrap;overflow-wrap:anywhere;vertical-align:top}
.field-range-cell{min-width:265px;vertical-align:top}
.node-diagram text{fill:#e1e9f0;font-size:12px;pointer-events:none}
.node-diagram .dim{fill:#9eacba;font-size:10px}
.node-diagram .lane-in{fill:#83d7cb}.node-diagram .lane-out{fill:#a0c7f5}
@media(max-width:750px){.layout{grid-template-columns:190px 1fr}main{padding:12px}.form{grid-template-columns:1fr}header{flex-wrap:wrap}header .actions{margin-left:0}}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Interfy Partner Editor</h1><small>오프라인 협력사 노드·메시지 편집기</small></div>
  <div class="actions">
    <button id="open">JSON 열기</button>
    <button id="validate">검증</button>
    <button id="save" class="primary">JSON 저장</button>
  </div>
  <input id="file" type="file" accept=".json,application/json" hidden>
</header>
<div class="notice">인터넷 연결 없이 동작합니다. Chrome·Edge에서는 JSON 저장 시 열었던 원본 파일에 덮어씁니다(브라우저 쓰기 권한 필요). 미지원 브라우저에서는 파일 선택 또는 다운로드로 저장합니다.</div>
<div class="layout">
  <aside>
    <nav><button class="active" id="tab-nodes">노드</button><button id="tab-messages">메시지 / Enum</button></nav>
    <div class="sidebar-tools"><input id="search" placeholder="이름 검색"><button id="add" title="현재 항목 추가">+ 추가</button></div>
    <div id="list" class="list"></div>
  </aside>
  <main><div id="editor" class="editor"></div></main>
</div>
<div class="footer"><span id="status">작업 패키지 JSON을 열어 주세요.</span><span id="stats"></span></div>
<script>
'use strict';
(function(){
var data=null, tab='nodes', active=-1, selectedEdge=null, dirty=false, filename='interfy-partner-edited.json', fileHandle=null, saving=false;
var tableWidths={STRUCT:[145,112,160,110,150,300,95,150,115],ENUM:[180,140,290,115]};
var basic=['bool','char','int8','uint8','int16','uint16','int32','uint32','int64','uint64','float','double'];
var enumTypes=['int8','uint8','int16','uint16','int32','uint32','int64','uint64'];
var ident=/^[A-Za-z_][A-Za-z0-9_]*$/;
var $=function(id){return document.getElementById(id);};
var esc=function(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');};
function status(t,kind){$('status').textContent=t;$('status').className=kind||'';}
function mark(){dirty=true;stats();}
function stats(){
 $('stats').textContent=data?(data.integration_targets.length+'개 노드 · '+data.messages.length+'개 메시지/Enum'+(dirty?' · ● 미저장':'')):'';
}
function records(){return data?(tab==='nodes'?data.integration_targets:data.messages):[];}
function selected(){return records()[active]||null;}
function options(values,value){return values.map(function(v){return '<option value="'+esc(v)+'"'+(String(v)===String(value)?' selected':'')+'>'+esc(v)+'</option>';}).join('');}
function input(k,v,type){return '<input data-key="'+esc(k)+'" value="'+esc(v)+'"'+(type?' type="'+type+'"':'')+'>';}
function area(k,v){return '<textarea data-key="'+esc(k)+'">'+esc(v)+'</textarea>';}
function field(k,label,v,wide){return '<label'+(wide?' class="wide"':'')+'>'+label+input(k,v)+'</label>';}
function paragraph(k,label,v){return '<label class="wide">'+label+area(k,v)+'</label>';}
function unique(base,values){var x=base,i=1;while(values.some(function(v){return String(v).toLowerCase()===x.toLowerCase();})){x=base+'_'+i++;}return x;}
function norm(dataObject){
 if(!dataObject || typeof dataObject!=='object'||dataObject.format!=='interfy-project'||!Array.isArray(dataObject.messages)||!Array.isArray(dataObject.integration_targets))throw Error('Interfy 프로젝트 JSON 파일이 아닙니다.');
 dataObject.messages.forEach(function(m){m.fields=Array.isArray(m.fields)?m.fields:[];m.enum_values=Array.isArray(m.enum_values)?m.enum_values:[];m.tx_targets=Array.isArray(m.tx_targets)?m.tx_targets:[];m.rx_targets=Array.isArray(m.rx_targets)?m.rx_targets:[];m.labels=Array.isArray(m.labels)?m.labels:[];m.definition_type=m.definition_type||'STRUCT';});
 dataObject.groups=Array.isArray(dataObject.groups)?dataObject.groups:[];
 dataObject.labels=Array.isArray(dataObject.labels)?dataObject.labels:[];
 dataObject.project=dataObject.project||{name:'Partner project'};
}
async function load(file,handle){
 if(dirty&&!confirm('저장하지 않은 변경사항이 있습니다. 다른 파일을 열까요?'))return;
 try{
  var text=await file.text(),next=JSON.parse(text);
  norm(next);
  // Keep the previous handle if the new JSON cannot be read or parsed.
  data=next;fileHandle=handle||null;dirty=false;active=-1;selectedEdge=null;
  filename=file.name;render();
  status('불러오기 완료: '+filename+(fileHandle?' · 원본 덮어쓰기 가능':' · 저장 시 파일 선택/다운로드'),'message');
 }catch(e){alert('파일을 열 수 없습니다.\n'+e.message);}
}
async function openProject(){
 if(typeof window.showOpenFilePicker!=='function'||!window.isSecureContext){
  $('file').click();return;
 }
 try{
  // Obtain a handle in the direct click interaction for overwriting on save.
  var handles=await window.showOpenFilePicker({
   types:[{description:'Interfy JSON',accept:{'application/json':['.json']}}],
   multiple:false
  });
  if(handles&&handles[0])await load(await handles[0].getFile(),handles[0]);
 }catch(e){
  if(e.name==='AbortError')return;
  status('원본 파일을 열 수 없습니다. 브라우저 파일 접근 설정을 확인하세요.','error');
  alert('원본 파일을 열 수 없습니다.\n'+e.message);
 }
}
function changeTab(next){tab=next;active=-1;selectedEdge=null;render();}
function render(){
 $('tab-nodes').classList.toggle('active',tab==='nodes');$('tab-messages').classList.toggle('active',tab==='messages');
 var q=$('search').value.trim().toLowerCase();var rows=records();var list='';
 rows.forEach(function(row,i){
  var label=tab==='nodes'?row.name:row.struct_name;var sub=tab==='nodes'?(row.description||'설명 없음'):((row.definition_type||'STRUCT')+' · '+(row.name||''));
  if(q&&(label+' '+sub).toLowerCase().indexOf(q)<0)return;
  list+='<button class="list-item'+(i===active?' active':'')+'" data-select="'+i+'"><strong>'+esc(label)+'</strong><small>'+esc(sub)+'</small></button>';
 });
 $('list').innerHTML=list||'<div class="empty">표시할 항목이 없습니다.</div>';
 $('editor').innerHTML=!data?'<div class="empty"><h2>작업 패키지 열기</h2><p>Interfy에서 내보낸 JSON을 먼저 불러와 주세요.</p></div>':active<0?'<div class="empty">왼쪽에서 노드 또는 메시지를 선택하세요.</div>':tab==='nodes'?renderNode():renderMessage();
 stats();
}
// Node-centric topology derived only from existing tx_targets/rx_targets arrays.
// Each row depicts a possible message route, not a runtime-delivery guarantee.
function nodeTopology(nodeName){
 var peerMap=new Map();
 function ensurePeer(peer){
  if(peer===nodeName||!peer)return null;
  if(!peerMap.has(peer))peerMap.set(peer,{name:peer,inboundCount:0,outboundCount:0});
  return peerMap.get(peer);
 }
 data.messages.forEach(function(m){
  if(m.definition_type==='ENUM')return;
  var tx=m.tx_targets||[],rx=m.rx_targets||[];
  if(rx.includes(nodeName))tx.forEach(function(peer){var p=ensurePeer(peer);if(p)p.inboundCount++;});
  if(tx.includes(nodeName))rx.forEach(function(peer){var p=ensurePeer(peer);if(p)p.outboundCount++;});
 });
 var peers=Array.from(peerMap.values()).sort(function(a,b){return a.name.localeCompare(b.name,'ko');});
 return {peers:peers,inbound:peers.reduce(function(n,p){return n+p.inboundCount;},0),outbound:peers.reduce(function(n,p){return n+p.outboundCount;},0)};
}
function diagramText(s,max){s=String(s||'');return esc(s.length>max?s.slice(0,max-1)+'…':s);}
function edgeMessages(nodeName,peer,direction){
 var sender=direction==='in'?peer:nodeName,receiver=direction==='in'?nodeName:peer;
 return data.messages.filter(function(m){return m.definition_type!=='ENUM'&&(m.tx_targets||[]).includes(sender)&&(m.rx_targets||[]).includes(receiver);});
}
function renderNodeDiagram(nodeName){
 var topology=nodeTopology(nodeName),peers=topology.peers;
 if(!peers.length)return '<div class="panel"><h3>관계도</h3><p class="hint">다른 노드와 연결된 메시지 관계가 없습니다.</p></div>';
 var w=980,h=Math.max(450,260+peers.length*42),cx=490,cy=h/2;
 var rx=310,ry=Math.max(155,Math.min(h/2-85,140+peers.length*10));
 var svg='<svg class="node-diagram" viewBox="0 0 '+w+' '+h+'" role="group" aria-label="'+esc(nodeName)+'의 노드 간 단방향 관계도">'+
 '<defs><marker id="arrow-in" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#67c9ba"/></marker>'+
 '<marker id="arrow-out" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#89b7ee"/></marker>'+ 
 '<marker id="arrow-selected" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#ffcf7d"/></marker></defs>';
 function curved(x1,y1,x2,y2,bend){
  var dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
  return 'M'+x1+' '+y1+' C'+(x1+dx*.25+nx*bend)+' '+(y1+dy*.25+ny*bend)+' '+(x1+dx*.75+nx*bend)+' '+(y1+dy*.75+ny*bend)+' '+x2+' '+y2;
 }
 function drawEdge(peer,dir,path,count){
  var chosen=selectedEdge&&selectedEdge.node===nodeName&&selectedEdge.peer===peer.name&&selectedEdge.direction===dir;
  var from=dir==='in'?peer.name:nodeName,to=dir==='in'?nodeName:peer.name;
  return '<g class="edge-group'+(chosen?' selected':'')+'" data-edge-peer="'+esc(peer.name)+'" data-edge-direction="'+dir+'" tabindex="0" role="button" aria-label="'+esc(from+'에서 '+to+'로 송신하는 메시지 '+count+'개 보기')+'">'+
  '<title>'+esc(from+' → '+to+' ('+count+'개 메시지) — 클릭하여 아래 목록 필터링')+'</title>'+
  '<path class="edge '+dir+'" d="'+path+'" marker-end="url(#'+(chosen?'arrow-selected':dir==='in'?'arrow-in':'arrow-out')+')"/>'+
  '<path class="edge-hit" d="'+path+'"/></g>';
 }
 peers.forEach(function(peer,i){
  var angle=-Math.PI/2+2*Math.PI*i/peers.length,x=cx+Math.cos(angle)*rx,y=cy+Math.sin(angle)*ry;
  var dx=x-cx,dy=y-cy,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
  // Both arrowheads point to one destination. Opposite directions are separate parallel one-way curves.
  var hubX=cx+ux*83,hubY=cy+uy*51,nodeX=x-ux*73,nodeY=y-uy*26;
  if(peer.inboundCount)svg+=drawEdge(peer,'in',curved(nodeX,nodeY,hubX,hubY,-22),peer.inboundCount);
  if(peer.outboundCount)svg+=drawEdge(peer,'out',curved(hubX,hubY,nodeX,nodeY,-22),peer.outboundCount);
  var peerSelected=selectedEdge&&selectedEdge.node===nodeName&&selectedEdge.peer===peer.name&&selectedEdge.direction==='both';
  svg+='<g class="node-select'+(peerSelected?' selected':'')+'" data-diagram-node="'+esc(peer.name)+'" tabindex="0" role="button" aria-label="'+esc(peer.name+'와 송수신하는 모든 메시지 보기')+'">'+
  '<title>'+esc(peer.name+' 관련 송수신 메시지 전체 보기')+'</title>'+
  '<rect class="node-box" x="'+(x-70)+'" y="'+(y-22)+'" width="140" height="44" rx="8"/>'+
  '<text x="'+x+'" y="'+(y+4)+'" text-anchor="middle">'+diagramText(peer.name,17)+'</text></g>';
 });
 svg+='<g class="node-select" data-diagram-node="'+esc(nodeName)+'" tabindex="0" role="button" aria-label="'+esc(nodeName+' 관련 모든 메시지 보기')+'">'+
 '<title>선택 노드의 전체 연결 메시지 보기</title>'+
 '<rect class="hub" x="'+(cx-80)+'" y="'+(cy-48)+'" width="160" height="96" rx="12"/>'+
 '<text x="'+cx+'" y="'+(cy-11)+'" text-anchor="middle" class="dim">선택 노드</text>'+
 '<text x="'+cx+'" y="'+(cy+13)+'" text-anchor="middle" font-weight="bold">'+diagramText(nodeName,19)+'</text></g></svg>';
 return '<div class="panel"><h3>관계도</h3><div class="diagram-scroll">'+svg+'</div></div>';
}
function renderNode(){
 var n=selected(),related=data.messages.filter(function(m){return (m.tx_targets||[]).includes(n.name)||(m.rx_targets||[]).includes(n.name);});
 var filtering=selectedEdge&&selectedEdge.node===n.name;
 var entries=[];
 if(filtering){
  var peer=selectedEdge.peer;
  if(selectedEdge.direction==='in'||selectedEdge.direction==='both'){
   edgeMessages(n.name,peer,'in').forEach(function(m){entries.push({message:m,from:peer,to:n.name});});
  }
  if(selectedEdge.direction==='out'||selectedEdge.direction==='both'){
   edgeMessages(n.name,peer,'out').forEach(function(m){entries.push({message:m,from:n.name,to:peer});});
  }
 }else{
  related.forEach(function(m){
   var tx=m.tx_targets||[],rx=m.rx_targets||[];
   if(tx.includes(n.name))rx.filter(function(peer){return peer!==n.name;}).forEach(function(peer){entries.push({message:m,from:n.name,to:peer});});
   if(rx.includes(n.name))tx.filter(function(peer){return peer!==n.name;}).forEach(function(peer){entries.push({message:m,from:peer,to:n.name});});
  });
 }
 var title=filtering?(selectedEdge.direction==='both'?selectedEdge.peer+' (전체)':selectedEdge.direction==='in'?selectedEdge.peer+' → '+n.name:n.name+' → '+selectedEdge.peer):'전체';
 return '<div class="section-title"><h2>노드 수정</h2><button class="danger" data-action="delete-node">노드 삭제</button></div>'+

 }else{
  row[key]=value;
  if(key==='protocol')row.protocols=value.split(/[,;\n|+]/).map(function(t){return t.trim();}).filter(Boolean);
 }

function validate(){
 if(!data)return ['JSON 파일을 먼저 열어 주세요.'];
 var errors=[],names=new Set(),nodeNames=new Set(),infos=new Set();
 data.integration_targets.forEach(function(n){
  var name=String(n.name||'').trim();
  if(!name||nodeNames.has(name.toLowerCase()))errors.push('노드 이름 누락/중복: '+name);
  nodeNames.add(name.toLowerCase());
 });
 data.messages.forEach(function(m){
  if(!ident.test(m.struct_name||'')||names.has(m.struct_name.toLowerCase()))errors.push('메시지/Enum 이름 오류 또는 중복: '+m.struct_name);
  names.add(String(m.struct_name||'').toLowerCase());
  if(!String(m.name||'').trim())errors.push('메시지 용도 누락: '+m.struct_name);
  if(m.definition_type==='STRUCT'){
   if(m.infocode&&!/^\d+$/.test(String(m.infocode)))errors.push('정보코드는 숫자여야 합니다: '+m.struct_name);
   if(m.infocode){if(infos.has(String(m.infocode)))errors.push('정보코드 중복: '+m.infocode);infos.add(String(m.infocode));}
   if(!['','0','비주기'].includes(String(m.period||''))&&!/^\d+$/.test(String(m.period)))errors.push('주기는 숫자 또는 비주기: '+m.struct_name);
  }
  var seen=new Set(),enumNums=new Set();
  (m.definition_type==='ENUM'?m.enum_values:m.fields).forEach(function(f){
   if(!ident.test(f.name||'')||seen.has(String(f.name||'').toLowerCase()))errors.push(m.struct_name+'.'+f.name+': 필드/Enum 이름 오류 또는 중복');
   seen.add(String(f.name||'').toLowerCase());
   if(m.definition_type==='ENUM'){
    if(!Number.isInteger(f.value)||enumNums.has(f.value))errors.push(m.struct_name+'.'+f.name+': Enum 정수 값 오류/중복');
    enumNums.add(f.value);
   }else{
    if(f.type_kind==='BASIC'&&!basic.includes(f.data_type))errors.push(m.struct_name+'.'+f.name+': 지원하지 않는 기본 자료형');
    if(f.type_kind==='MESSAGE'||f.type_kind==='ENUM'){
     var dep=data.messages.find(function(d){return d.struct_name===(f.ref_message||f.data_type);});
     if(!dep||(dep.definition_type==='ENUM'?'ENUM':'MESSAGE')!==f.type_kind)errors.push(m.struct_name+'.'+f.name+': 잘못된 참조 자료형');
     if(dep===m)errors.push(m.struct_name+'.'+f.name+': 자기 자신을 참조할 수 없음');
    }
    if(f.array_dimensions&&!/^[1-9]\d*(,[1-9]\d*)*$/.test(String(f.array_dimensions)))errors.push(m.struct_name+'.'+f.name+': 배열 차원 형식 오류 (예: 4,8)');
   }
  });
  ['tx_targets','rx_targets'].forEach(function(direction){m[direction].forEach(function(name){if(!nodeNames.has(name.toLowerCase()))errors.push(m.struct_name+': 등록되지 않은 노드 '+name);});});
 });
 // Check reference cycles after all names are available.
 var edges={};data.messages.filter(function(m){return m.definition_type==='STRUCT';}).forEach(function(m){edges[m.struct_name]=m.fields.filter(function(f){return f.type_kind==='MESSAGE';}).map(function(f){return f.ref_message||f.data_type;});});
 var activeSet=new Set(),done=new Set();
 function visit(name){if(activeSet.has(name)){errors.push('순환 참조: '+name);return;}if(done.has(name))return;activeSet.add(name);(edges[name]||[]).forEach(function(n){if(edges[n])visit(n);});activeSet.delete(name);done.add(name);}
 Object.keys(edges).forEach(visit);
 return errors;
}
function downloadCopy(contents){

 document.body.appendChild(a);a.click();a.remove();
 setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
async function writeToHandle(handle,contents){
 var writable=await handle.createWritable();
 await writable.write(contents);
 await writable.close();
}
async function save(){
 if(!data){alert('JSON 파일을 먼저 열어 주세요.');return;}
 if(saving)return;
 var errors=validate();
 if(errors.length){alert('검증 오류 ('+errors.length+'건)\n'+errors.slice(0,15).join('\n')+(errors.length>15?'\n...':''));status('검증 오류 '+errors.length+'건','error');return;}
 data.messages.forEach(function(m,i){m.order=i+1;m.fields.forEach(function(f,j){f.order=j+1;});m.enum_values.forEach(function(v,j){v.order=j+1;});m.protocols=(m.protocol||'').split(/[,;\n|+]/).map(function(x){return x.trim();}).filter(Boolean);});
 var contents=JSON.stringify(data,null,2);
 saving=true;$('save').disabled=true;
 try{
  if(fileHandle){
   // The original file handle is reused, not a new filename/download.
   await writeToHandle(fileHandle,contents);
   dirty=false;stats();status('원본 JSON에 덮어썼습니다: '+filename,'message');
  }else if(typeof window.showSaveFilePicker==='function'&&window.isSecureContext){
   // A file input does not grant permission to overwrite. Ask for a path.
   var chosen=await window.showSaveFilePicker({
    suggestedName:filename,
    types:[{description:'Interfy JSON',accept:{'application/json':['.json']}}]
   });
   await writeToHandle(chosen,contents);
   fileHandle=chosen;filename=chosen.name||filename;
   dirty=false;stats();status('선택한 JSON에 저장했습니다: '+filename,'message');
  }else{
   downloadCopy(contents);
   dirty=false;stats();status('다운로드로 저장했습니다. 원본 파일은 덮어쓰지 않았습니다.','warn');
  }
 }catch(e){
  // On failure retain the current content and dirty state; never fake success.
  if(e.name==='AbortError')status('저장을 취소했습니다. 수정 내용은 유지됩니다.','warn');
  else{status('저장 실패: 수정 내용은 유지됩니다.','error');alert('JSON 파일을 저장할 수 없습니다.\n'+e.message);}
 }finally{saving=false;$('save').disabled=false;}
}

  grip.classList.remove('dragging');document.body.classList.remove('resizing-columns');
 }
 document.addEventListener('pointermove',move);
 document.addEventListener('pointerup',stop);
 document.addEventListener('pointercancel',stop);
});
$('editor').addEventListener('click',function(e){
 var diagramNode=e.target.closest('[data-diagram-node]');
 if(diagramNode){selectDiagramNode(diagramNode);return;}
 var edge=e.target.closest('[data-edge-peer]');
 if(edge){selectDiagramEdge(edge);return;}
 var jump=e.target.closest('[data-jump-message]');
 if(jump){tab='messages';active=Number(jump.dataset.jumpMessage);selectedEdge=null;$('search').value='';render();return;}
 var b=e.target.closest('[data-action]');if(!b)return;
 var action=b.dataset.action;
 if(action==='clear-edge'){selectedEdge=null;refreshNodeEditor();}
 else if(action==='delete-node'||action==='delete-message')removeSelected();
 else if(action==='copy-message')copyMessage();
 else if(['add-row','remove-row','up','down'].includes(action))rowAction(action,Number(b.dataset.row));
});
$('editor').addEventListener('keydown',function(e){
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-diagram-node]')){e.preventDefault();selectDiagramNode(e.target);return;}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-edge-peer]')){e.preventDefault();selectDiagramEdge(e.target);return;}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-jump-message]')){e.preventDefault();tab='messages';active=Number(e.target.dataset.jumpMessage);selectedEdge=null;$('search').value='';render();}
});
window.addEventListener('beforeunload',function(e){if(!dirty)return;e.preventDefault();e.returnValue='';});
render();
})();
</script>
</body>
</html>
